<svg width="1200" height="400" viewBox="0 0 1200 400" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Farid Sayago · Ingeniero de Datos · Cloud e Infraestructura</title>
  <desc id="desc">Banner con panel azul petróleo, acentos naranja y un panel verde de hoja con gotas de agua. Titular: Cloud e infra para datos que fluyen. Palabras clave: AWS, IaC, Kubernetes, CI/CD, ETL, Snowflake.</desc>
  <defs>
    <clipPath id="card"><rect width="1200" height="400" rx="18"/></clipPath>
    <linearGradient id="navy" x1="0" y1="0" x2="1200" y2="400" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1b2d3e"/>
      <stop offset="1" stop-color="#0f1b27"/>
    </linearGradient>
    <linearGradient id="leaf" x1="800" y1="400" x2="1200" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1f3d2b"/>
      <stop offset="0.55" stop-color="#3f6b45"/>
      <stop offset="1" stop-color="#6f9a63"/>
    </linearGradient>
    <radialGradient id="drop" cx="0.35" cy="0.3" r="0.85">
      <stop stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="0.5" stop-color="#cfe3d2" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#0f1b27" stop-opacity="0.35"/>
    </radialGradient>
    <pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1" fill="#2c4357"/>
    </pattern>
    <style>
      .head{font-family:'Space Grotesk','Rajdhani','Segoe UI','Helvetica Neue',Arial,sans-serif;font-weight:600}
      .mono{font-family:'JetBrains Mono','Fira Code','Cascadia Code',Consolas,monospace}
      .white{fill:#e3e8ec}.orange{fill:#f47b20}.muted{fill:#8fa3b3}
      .tag{font-size:11px;letter-spacing:3px;fill:#f47b20}
      .chip{fill:#14232f;stroke:#2c4357;stroke-width:1}
      .chipHot{fill:#f47b20;stroke:#f47b20;stroke-width:1}
      .chipText{fill:#e3e8ec;font-size:14px;text-anchor:middle}
      .chipHotText{fill:#0f1b27;font-size:14px;font-weight:700;text-anchor:middle}
    </style>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1200" height="400" fill="url(#navy)"/>
    <rect width="1200" height="400" fill="url(#dots)" opacity="0.5"/>

    <path d="M860 0H1200V400H780Z" fill="url(#leaf)"/>
    <g stroke="#cfe3d2" stroke-width="1.4" opacity="0.22" fill="none">
      <path d="M800 400C900 300 1000 200 1130 30"/>
      <path d="M870 335C925 330 985 305 1040 268"/>
      <path d="M930 280C985 280 1040 255 1085 215"/>
      <path d="M985 215C1030 210 1075 185 1110 150"/>
      <path d="M1040 150C1075 145 1110 120 1135 90"/>
      <path d="M880 360C905 345 925 325 940 300"/>
    </g>
    <g opacity="0.95">
      <g><circle cx="1010" cy="90" r="38" fill="url(#drop)" stroke="#e8f3ea" stroke-opacity="0.45"/><ellipse cx="998.6" cy="74.8" rx="10.6" ry="6.8" fill="#fff" opacity="0.75"/></g>
      <g><circle cx="1110" cy="215" r="46" fill="url(#drop)" stroke="#e8f3ea" stroke-opacity="0.45"/><ellipse cx="1096" cy="196.6" rx="12.9" ry="8.3" fill="#fff" opacity="0.75"/></g>
      <g><circle cx="930" cy="255" r="26" fill="url(#drop)" stroke="#e8f3ea" stroke-opacity="0.45"/><ellipse cx="922.2" cy="244.6" rx="7.3" ry="4.7" fill="#fff" opacity="0.75"/></g>
      <g><circle cx="1050" cy="335" r="34" fill="url(#drop)" stroke="#e8f3ea" stroke-opacity="0.45"/><ellipse cx="1039.8" cy="321.4" rx="9.5" ry="6.1" fill="#fff" opacity="0.75"/></g>
      <g><circle cx="900" cy="115" r="11" fill="url(#drop)" stroke="#e8f3ea" stroke-opacity="0.45"/><ellipse cx="896.7" cy="110.6" rx="3.1" ry="2" fill="#fff" opacity="0.75"/></g>
      <g><circle cx="1150" cy="95" r="13" fill="url(#drop)" stroke="#e8f3ea" stroke-opacity="0.45"/><ellipse cx="1146.1" cy="89.8" rx="3.6" ry="2.3" fill="#fff" opacity="0.75"/></g>
      <g><circle cx="975" cy="190" r="16" fill="url(#drop)" stroke="#e8f3ea" stroke-opacity="0.45"/><ellipse cx="970.2" cy="183.6" rx="4.5" ry="2.9" fill="#fff" opacity="0.75"/></g>
      <g><circle cx="1160" cy="335" r="10" fill="url(#drop)" stroke="#e8f3ea" stroke-opacity="0.45"/><ellipse cx="1157" cy="331" rx="2.8" ry="1.8" fill="#fff" opacity="0.75"/></g>
      <g><circle cx="965" cy="365" r="9" fill="url(#drop)" stroke="#e8f3ea" stroke-opacity="0.45"/><ellipse cx="962.3" cy="361.7" rx="2.5" ry="1.6" fill="#fff" opacity="0.75"/></g>
    </g>
    <path d="M860 0L780 400" stroke="#f47b20" stroke-width="2"/>

    <path d="M0 132L56 0" stroke="#f47b20" stroke-width="1.6"/>
    <path d="M0 64L150 0" stroke="#e3e8ec" stroke-width="1.2" opacity="0.7"/>
  </g>

  <text x="96" y="56" class="mono tag">FARID SAYAGO  /  INGENIERO DE DATOS  /  CLOUD E INFRA</text>

  <text x="96" y="112" class="head white" font-size="54" textLength="430" lengthAdjust="spacingAndGlyphs">CLOUD E INFRA</text>
  <text x="96" y="168" class="head white" font-size="54" textLength="462" lengthAdjust="spacingAndGlyphs">PARA DATOS QUE</text>
  <text x="576" y="168" class="head orange" font-size="54" textLength="198" lengthAdjust="spacingAndGlyphs">FLUYEN</text>

  <text x="96" y="204" class="mono muted" font-size="14" letter-spacing="1.6">AWS <tspan class="orange">/</tspan> IaC <tspan class="orange">/</tspan> Kubernetes <tspan class="orange">/</tspan> CI-CD <tspan class="orange">/</tspan> ETL <tspan class="orange">/</tspan> Snowflake</text>

  <text x="96" y="240" class="mono tag">// CLOUD E INFRA</text>
  <g transform="translate(96 250)">
    <g><rect class="chipHot" width="60" height="32" rx="7"/><text x="30" y="21" class="mono chipHotText">AWS</text></g>
    <g transform="translate(70 0)"><rect class="chip" width="108" height="32" rx="7"/><text x="54" y="21" class="mono chipText">Terraform</text></g>
    <g transform="translate(188 0)"><rect class="chip" width="116" height="32" rx="7"/><text x="58" y="21" class="mono chipText">Kubernetes</text></g>
    <g transform="translate(314 0)"><rect class="chip" width="82" height="32" rx="7"/><text x="41" y="21" class="mono chipText">Docker</text></g>
    <g transform="translate(406 0)"><rect class="chip" width="150" height="32" rx="7"/><text x="75" y="21" class="mono chipText">GitHub Actions</text></g>
    <g transform="translate(566 0)"><rect class="chip" width="74" height="32" rx="7"/><text x="37" y="21" class="mono chipText">Linux</text></g>
  </g>

  <text x="96" y="306" class="mono tag">// DATOS</text>
  <g transform="translate(96 316)">
    <g><rect class="chip" width="84" height="32" rx="7"/><text x="42" y="21" class="mono chipText">Python</text></g>
    <g transform="translate(94 0)"><rect class="chip" width="60" height="32" rx="7"/><text x="30" y="21" class="mono chipText">SQL</text></g>
    <g transform="translate(164 0)"><rect class="chip" width="110" height="32" rx="7"/><text x="55" y="21" class="mono chipText">Snowflake</text></g>
    <g transform="translate(284 0)"><rect class="chip" width="100" height="32" rx="7"/><text x="50" y="21" class="mono chipText">Power BI</text></g>
    <g transform="translate(394 0)"><rect class="chip" width="118" height="32" rx="7"/><text x="59" y="21" class="mono chipText">PostgreSQL</text></g>
  </g>

  <text x="96" y="380" class="mono muted" font-size="12" textLength="660" lengthAdjust="spacing"><tspan class="orange">CERTS</tspan>  Cloud &amp; DevOps Fundamentals · Data Engineer · AI Software Engineer · IBM Python</text>
</svg>
