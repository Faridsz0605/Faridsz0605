<svg width="1200" height="400" viewBox="0 0 1200 400" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Farid Sayago · Data Scientist</title>
  <desc id="desc">Dark data systems banner with blue grid, network graph, terminal cards, and technology badges.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="400" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#020817"/>
      <stop offset="0.46" stop-color="#061226"/>
      <stop offset="1" stop-color="#020817"/>
    </linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(820 150) rotate(121) scale(430 250)">
      <stop stop-color="#008cff" stop-opacity="0.36"/>
      <stop offset="1" stop-color="#020817" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="lineBlue" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#2563eb"/>
    </linearGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" stroke="#123154" stroke-width="1" opacity="0.45"/>
    </pattern>
    <filter id="softGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <style>
      .serif{font-family:Georgia,'Times New Roman',serif}.mono{font-family:'JetBrains Mono','Fira Code','Cascadia Code',Consolas,monospace}.blue{fill:#38bdf8}.soft{fill:#dbeafe}.muted{fill:#8aa4c3}.line{stroke:#1d4ed8;stroke-width:1.2;opacity:.68}.chip{fill:#071427;stroke:#1d4ed8;stroke-width:1}.chipText{fill:#e5edf8;font-size:14px}.label{fill:#38bdf8;font-size:15px;letter-spacing:5px}.small{fill:#93a4bc;font-size:12px}.node{fill:#38bdf8;filter:url(#softGlow)}
    </style>
  </defs>

  <rect width="1200" height="400" rx="18" fill="url(#bg)"/>
  <rect width="1200" height="400" rx="18" fill="url(#grid)" opacity="0.42"/>
  <rect width="1200" height="400" rx="18" fill="url(#glow)"/>

  <g opacity="0.75">
    <circle cx="18" cy="66" r="1.7" fill="#2ea8ff"/><circle cx="32" cy="66" r="1.7" fill="#2ea8ff"/><circle cx="46" cy="66" r="1.7" fill="#2ea8ff"/>
    <circle cx="18" cy="80" r="1.7" fill="#2ea8ff"/><circle cx="32" cy="80" r="1.7" fill="#2ea8ff"/><circle cx="46" cy="80" r="1.7" fill="#2ea8ff"/>
    <circle cx="18" cy="94" r="1.7" fill="#2ea8ff"/><circle cx="32" cy="94" r="1.7" fill="#2ea8ff"/><circle cx="46" cy="94" r="1.7" fill="#2ea8ff"/>
  </g>
  <path d="M64 48V137" stroke="#1d8cff" stroke-width="1.7" opacity="0.85"/>

  <text x="94" y="106" class="serif soft" font-size="54" letter-spacing="-1.4">Farid Sayago · Data Scientist</text>
  <text x="96" y="139" class="mono soft" font-size="17" letter-spacing="1.4">Data Science  •  MLOps  •  Architecture Engineering</text>

  <g transform="translate(96 180)">
