    <path d="M660 303C741 239 817 238 899 287C973 330 1056 304 1166 247" stroke="#1d4ed8" stroke-width="1" fill="none" opacity="0.75"/>
    <path d="M660 319C739 257 818 256 898 302C975 346 1056 322 1166 268" stroke="#0ea5e9" stroke-width="1" fill="none" opacity="0.55"/>
