    <g transform="translate(0 24)"><rect class="chip" width="86" height="35" rx="7"/><text x="18" y="23" class="mono chipText">Python</text></g>
    <g transform="translate(98 24)"><rect class="chip" width="68" height="35" rx="7"/><text x="18" y="23" class="mono chipText">SQL</text></g>
    <g transform="translate(178 24)"><rect class="chip" width="74" height="35" rx="7"/><text x="18" y="23" class="mono chipText">AWS</text></g>
