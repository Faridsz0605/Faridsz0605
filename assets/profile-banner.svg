    <g transform="translate(369 24)"><rect class="chip" width="91" height="35" rx="7"/><text x="18" y="23" class="mono chipText">Docker</text></g>
    <g transform="translate(472 24)"><rect class="chip" width="121" height="35" rx="7"/><text x="18" y="23" class="mono chipText">Kubernetes</text></g>
    <g transform="translate(605 24)"><rect class="chip" width="92" height="35" rx="7"/><text x="18" y="23" class="mono chipText">FastAPI</text></g>
